name: Flask CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build artifact
        run: |
          mkdir -p dist
          tar -czf dist/flask-cicd.tar.gz \
            app.py \
            requirements.txt \
            Dockerfile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-build
          path: dist/flask-cicd.tar.gz

  test:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-build
          path: dist

      - name: Extract artifact
        run: |
          mkdir -p test-build
          tar -xzf dist/flask-cicd.tar.gz -C test-build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test-build/requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=test-build python -m pytest tests/

  docker:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-build
          path: dist

      - name: Extract artifact
        run: |
          mkdir -p docker-build
          tar -xzf dist/flask-cicd.tar.gz -C docker-build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build -t "$IMAGE_NAME" docker-build

      - name: Push Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker push "$IMAGE_NAME"

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker pull "$IMAGE_NAME"

      - name: Deploy application
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "Deploying $IMAGE_NAME"
          echo "Deployment successful!"
